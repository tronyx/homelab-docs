image: nikolaik/python-nodejs:python3.14-nodejs26

before_script:
  - apt-get update
  - apt-get install -y pngquant libpng-dev libcairo2
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install --no-cache-dir -r requirements.txt

test:
  stage: test
  script:
  - mkdocs build --strict --verbose --site-dir test
  artifacts:
    paths:
    - test
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  variables:
    GIT_DEPTH: "0"
  script:
  - mkdocs build --strict --verbose -d public
  #- zensical build --strict
  artifacts:
    paths:
    - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
